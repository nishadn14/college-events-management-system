<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Campus Events{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header class="top"><div class="wrap"><a class="brand" href="{{ url_for('index') }}">Campus<b>Events</b></a>
<nav><a href="{{ url_for('index') }}">Events</a>
{% if session.admin %}<a href="{{ url_for('admin') }}">Manage</a><a href="{{ url_for('logout') }}">Log out</a>
{% else %}<a href="{{ url_for('login') }}">Admin</a>{% endif %}</nav></div></header>
<main class="wrap">
{% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}" role="status">{{ msg }}</div>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
